plugins {
    // AGP 9 compiles Kotlin itself (built-in Kotlin): no org.jetbrains.kotlin.android plugin.
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def tagName = '1.0.2'

// Optional release signing from local.properties (untracked): storeFile, storePassword,
// keyAlias, keyPassword. Without it the release build is signed with the debug key.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def hasReleaseKey = localProps.getProperty("storeFile") != null

android {
    compileSdk 37
    defaultConfig {
        // Own application id so Tears GPS does not clash with the original GPS Setter.
        // The source namespace stays io.github.jqssun.gpssetter.
        applicationId "io.github.nikakvo.tearsgps"
        minSdk 27
        targetSdk 34
        versionCode 102
        versionName tagName
        // testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")
        // GitHub repo checked for updates ("owner/name"); empty = no update check at all.
        buildConfigField("String", "UPDATE_REPO", "\"\"")
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias localProps['keyAlias']
                keyPassword localProps['keyPassword']
                storeFile file(localProps['storeFile'])
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions += "version"
    productFlavors {
        foss {
            dimension "version"
            // OpenStreetMap maps (MapLibre + OpenFreeMap) and microG location: no Google services.
            applicationIdSuffix ".foss"
            versionNameSuffix "-foss"
            buildConfigField("String", "UPDATE_REPO", "\"nikakvo/tears-gps\"")
            isDefault true
        }
    }

    namespace 'io.github.jqssun.gpssetter'
}

dependencies {

    // Modern Xposed API (libxposed 102): the API is supplied by the framework at runtime,
    // the service library ships in the APK and lets the UI talk to LSPosed (remote prefs).
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // foss: microG location (Apache 2.0) + MapLibre (BSD 2-clause) with OpenFreeMap tiles
    fossImplementation 'org.microg.gms:play-services-location:0.3.14.250932'
    fossImplementation 'org.maplibre.gl:android-sdk:13.6.1'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    implementation 'com.github.lukkass222:virtual-joystick-android:1.13.5'
}
